name: Release

# Push a tag like v1.0.1 to build the Mac and Windows installers and publish them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [both, windows, mac]
        default: both

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'mac' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      # Attach the installers to the release for this version, making the release if it does not exist yet.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "Arubis ${VERSION#v}" --notes "Arubis for Mac and Windows."
          FILES=$(ls dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml 2>/dev/null || true)
          gh release upload "$VERSION" $FILES --clobber
